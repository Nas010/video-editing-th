[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-th"
version = "0.1.0"
description = "Codex-driven Thai talking-head video editing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nas010" }]
keywords = ["video-editing", "thai", "codex", "chatcut", "whisper", "ffmpeg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Nas010/video-editing-th"
Repository = "https://github.com/Nas010/video-editing-th"
Issues = "https://github.com/Nas010/video-editing-th/issues"

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1,<2"]
scene-detection = ["scenedetect[opencv]>=0.6.5,<0.7"]
timeline = ["opentimelineio>=0.17,<0.19"]
all = [
  "faster-whisper>=1.1,<2",
  "scenedetect[opencv]>=0.6.5,<0.7",
  "opentimelineio>=0.17,<0.19",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
video-editing-th = "video_editing_th.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/video-editing-th/skill" = ["skills/video-editing-th/SKILL.md"]
"share/video-editing-th/skill/references" = ["skills/video-editing-th/references/*.md"]
"share/video-editing-th/profiles" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video_editing_th"]
mypy_path = "src"

[tool.coverage.run]
source = ["video_editing_th"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
